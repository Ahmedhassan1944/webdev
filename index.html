<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Learning Platform</title>
    <!-- SEO & Best Practices -->
    <meta name="description" content="Offline learning platform to watch downloaded courses.">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Left Sidebar (Navigation) -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <i class='bx bxs-graduation'></i>
                <span>LocalSchool</span>
            </div>
            
            <div class="search-box">
                <i class='bx bx-search'></i>
                <input type="text" id="search-input" placeholder="Search lessons...">
            </div>

            <nav class="course-nav">
                <h3 class="nav-title">COURSES</h3>
                <ul id="course-list">
                    <!-- Injected via JS -->
                </ul>
            </nav>
            
            <div class="progress-section">
                <h3 class="nav-title">OVERALL PROGRESS</h3>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="overall-progress" style="width: 0%"></div>
                </div>
                <span class="progress-text" id="overall-progress-text">0% Completed</span>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Menu">
                        <i class='bx bx-menu'></i>
                    </button>
                    <h1 id="current-course-title">Welcome to LocalSchool</h1>
                </div>
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </header>

            <!-- Video Player Section -->
            <div class="video-section">
                <div class="player-wrapper" id="player-wrapper">
                    <video id="main-video" class="main-video">
                        <!-- Source injected via JS -->
                        Your browser does not support HTML video.
                    </video>

                    <!-- Custom Loading Overlay -->
                    <div class="loading-overlay" id="loading-overlay">
                        <div class="spinner"></div>
                    </div>

                    <!-- Hidden canvas for thumbnail capture -->
                    <canvas id="thumbnail-canvas" style="display:none;"></canvas>

                    <!-- Seek Thumbnail Preview -->
                    <div class="seek-thumbnail" id="seek-thumbnail">
                        <canvas id="seek-thumb-canvas"></canvas>
                        <span class="seek-time-label" id="seek-time-label">0:00</span>
                    </div>

                    <!-- Custom Video Controls -->
                    <div class="custom-controls" id="custom-controls">
                        <!-- Progress / Seek Bar -->
                        <div class="seek-bar-wrapper">
                            <div class="seek-bar" id="seek-bar">
                                <div class="seek-buffered" id="seek-buffered"></div>
                                <div class="seek-progress" id="seek-progress"></div>
                                <div class="seek-handle" id="seek-handle"></div>
                            </div>
                        </div>

                        <!-- Controls Row -->
                        <div class="controls-row">
                            <div class="controls-left">
                                <button class="ctrl-btn" id="ctrl-prev" title="Previous Lesson">
                                    <i class='bx bx-skip-previous'></i>
                                </button>
                                <button class="ctrl-btn" id="ctrl-play" title="Play/Pause">
                                    <i class='bx bx-play'></i>
                                </button>
                                <button class="ctrl-btn" id="ctrl-next" title="Next Lesson">
                                    <i class='bx bx-skip-next'></i>
                                </button>
                                <div class="volume-group">
                                    <button class="ctrl-btn" id="ctrl-mute" title="Mute">
                                        <i class='bx bx-volume-full'></i>
                                    </button>
                                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" title="Volume">
                                </div>
                                <span class="time-display" id="time-display">0:00 / 0:00</span>
                            </div>
                            <div class="controls-right">
                                <button class="ctrl-btn" id="ctrl-speed" title="Playback Speed">1x</button>
                                <button class="ctrl-btn" id="ctrl-fullscreen" title="Fullscreen">
                                    <i class='bx bx-fullscreen'></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="video-info">
                    <div class="title-row">
                        <h2 id="current-lesson-title">Select a course to start learning</h2>
                        <button id="mark-completed-btn" class="completed-btn">
                            <i class='bx bx-check-circle'></i> Mark Completed
                        </button>
                    </div>
                    <p id="current-course-name" class="course-subtitle">Get ready to enhance your skills</p>
                </div>
            </div>
        </main>

        <!-- Right Sidebar (Playlist) -->
        <aside class="playlist-sidebar" id="playlist-sidebar">
            <div class="playlist-header">
                <h3>Course Content</h3>
                <span id="lesson-count" class="badge">0 Lessons</span>
            </div>
            <div class="playlist-items" id="playlist-items">
                <!-- Injected via JS -->
                <div class="empty-state">
                    <i class='bx bx-movie-play'></i>
                    <p>Select a course to view lessons</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
